
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090d18;color:#fff;
 font-family:Arial,sans-serif;display:flex;
 justify-content:center;min-height:100vh;
}
main{width:100%;max-width:850px;padding:25px;display:flex;flex-direction:column}
header{text-align:center;padding:25px}
h1{font-size:38px;color:#65caff;letter-spacing:4px}
header p{color:#9caec5}
#chat{flex:1;min-height:350px;max-height:65vh;overflow-y:auto;padding:15px}
.message{padding:14px 17px;border-radius:14px;margin:12px 0;line-height:1.5;white-space:pre-wrap}
.user{background:#174b75;margin-left:15%;text-align:right}
.ai{background:#172337;margin-right:15%}
form{display:flex;gap:10px;margin-top:15px}
input{flex:1;min-width:0;padding:16px;border-radius:12px;border:1px solid #33445e;background:#111c2d;color:white}
button{padding:14px 22px;border:0;border-radius:12px;background:#168bd1;color:white;font-weight:bold;cursor:pointer}
small{color:#8192a8;text-align:center;margin-top:15px}
</style>
</head>
<body>
<main>
<header>
<h1>NEXUS AI</h1>
<p>Inteligência • Memória • Autonomia</p>
</header>

<section id="chat" aria-live="polite">
<div class="message ai">Olá! Eu sou a NEXUS. Estou pronta para começar nossa jornada de aprendizado.</div>
</section>

<form id="form">
<input id="input" placeholder="Converse com a NEXUS..." autocomplete="off" required>
<button id="sendButton">Enviar</button>
</form>

<small>Protótipo inicial da NEXUS AI</small>
</main>

<script>
const form = document.getElementById('form');
const input = document.getElementById('input');
const chat = document.getElementById('chat');
const sendButton = document.getElementById('sendButton');

const API_URL =
'https://nexus-ai6124.anonimosf4t4l.workers.dev/';

// Cria uma identidade anônima persistente para este navegador.
function getSessionId() {
  let id = localStorage.getItem('nexus_session_id');

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('nexus_session_id', id);
  }

  return id;
}

const sessionId = getSessionId();

form.addEventListener('submit', async e => {
  e.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  input.value = '';
  sendButton.disabled = true;

  const pending = addMessage('', 'ai');
  pending.textContent = 'NEXUS AI está pensando...';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: message,
        sessionId: sessionId
      })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error || 'Erro no servidor.');
    }

    if (!response.body) {
      throw new Error('O servidor não enviou uma resposta.');
    }

    pending.textContent = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split(/\r?\n\r?\n/);
      buffer = events.pop() || '';

      for (const event of events) {
        const lines = event.split(/\r?\n/);

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;

          const raw = line.slice(5).trim();
          if (!raw || raw === '[DONE]') continue;

          try {
            const data = JSON.parse(raw);
            const parts = data.candidates?.[0]?.content?.parts || [];

            for (const part of parts) {
              if (part.text) {
                pending.textContent += part.text;
                chat.scrollTop = chat.scrollHeight;
              }
            }
          } catch (error) {
            console.log('Trecho recebido:', raw);
          }
        }
      }
    }

    if (!pending.textContent) {
      pending.textContent = 'A NEXUS não recebeu texto da IA.';
    }

  } catch (error) {
    pending.textContent = 'Erro: ' + error.message;
  } finally {
    sendButton.disabled = false;
    input.focus();
  }
});

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
</script>
</body>
</html>
